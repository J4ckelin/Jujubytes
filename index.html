<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-background">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jujubyte - E-commerce & Store Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3525cd",
            "primary-container": "#4f46e5",
            "on-primary": "#ffffff",
            "secondary": "#712ae2",
            "tertiary": "#00505f",
            "background": "#faf8ff",
            "surface": "#faf8ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f3ff",
            "surface-container": "#eaedff",
            "surface-container-high": "#e2e7ff",
            "surface-container-highest": "#dae2fd",
            "on-surface": "#131b2e",
            "on-surface-variant": "#464555",
            "outline": "#777587",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full font-sans text-on-surface bg-background antialiased selection:bg-primary/20 selection:text-primary">

  <div id="app" class="min-h-screen flex flex-col">
    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-surface-container-lowest border-b border-surface-container-high/60 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">

        <!-- Brand Logo & View Switcher -->
        <div class="flex items-center gap-6">
          <a href="#" onclick="switchView('store'); return false;" class="flex items-center gap-2.5 group">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white font-black text-xl shadow-md group-hover:scale-105 transition-transform">
              J
            </div>
            <div class="flex flex-col">
              <span class="font-extrabold text-lg text-primary tracking-tight leading-tight">Jujubyte</span>
              <span class="text-[10px] uppercase font-bold tracking-wider text-on-surface-variant/80">E-Commerce</span>
            </div>
          </a>

          <!-- View Switcher Pills -->
          <div class="flex items-center p-1 bg-surface-container-low rounded-xl border border-surface-container-high/50">
            <button id="nav-btn-store" onclick="switchView('store')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-surface-container-lowest text-primary shadow-sm">
              <span class="material-symbols-outlined text-[16px]">storefront</span>
              <span>Loja (Cliente)</span>
            </button>
            <button id="nav-btn-admin" onclick="switchView('admin')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-on-surface-variant hover:text-on-surface">
              <span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
              <span>Painel Admin</span>
            </button>
          </div>
        </div>

        <!-- Store Search & Cart (Visible in Store View) -->
        <div id="store-header-actions" class="flex-1 max-w-md hidden md:flex items-center gap-3">
          <div class="relative w-full">
            <span class="material-symbols-outlined absolute left-3 top-2.5 text-on-surface-variant text-[20px]">search</span>
            <input type="text" id="store-search-input" oninput="handleStoreSearch(this.value)" placeholder="Buscar produtos na Jujubyte..." class="w-full pl-10 pr-4 py-2 text-sm bg-surface-container-low rounded-xl text-on-surface placeholder:text-on-surface-variant/70 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all border border-transparent focus:border-primary/20" />
          </div>
        </div>

        <!-- Right Side Controls -->
        <div class="flex items-center gap-3">
          <!-- Cart Button (Store Mode) -->
          <button id="cart-btn" onclick="toggleCartDrawer(true)" class="relative p-2.5 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface transition-colors flex items-center gap-2 font-semibold text-sm">
            <span class="material-symbols-outlined text-[20px] text-primary">shopping_bag</span>
            <span class="hidden sm:inline">Carrinho</span>
            <span id="cart-badge" class="bg-primary text-on-primary text-[11px] font-extrabold px-2 py-0.5 rounded-full min-w-[20px] text-center">0</span>
          </button>
        </div>

      </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main id="main-content" class="flex-1">
      <!-- Dynamic View Injected Here -->
    </main>

    <!-- CART DRAWER -->
    <div id="cart-drawer-backdrop" onclick="if(event.target.id==='cart-drawer-backdrop') toggleCartDrawer(false)" class="fixed inset-0 bg-on-surface/40 backdrop-blur-xs z-50 transition-opacity duration-300 opacity-0 pointer-events-none hidden">
      <div id="cart-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-surface-container-lowest shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">

        <!-- Cart Header -->
        <div class="p-5 border-b border-surface-container-high/60 flex items-center justify-between bg-surface-container-low">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-[24px]">shopping_cart</span>
            <h3 class="font-extrabold text-lg text-on-surface">Seu Carrinho</h3>
            <span id="cart-drawer-count" class="text-xs bg-primary/10 text-primary font-bold px-2 py-0.5 rounded-full">(0 itens)</span>
          </div>
          <button onclick="toggleCartDrawer(false)" class="p-1.5 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-[20px]">close</span>
          </button>
        </div>

        <!-- Cart Items List -->
        <div id="cart-items-container" class="flex-1 overflow-y-auto p-5 space-y-4 divide-y divide-surface-container-low">
          <!-- Cart Items dynamically rendered -->
        </div>

        <!-- Cart Footer / Checkout -->
        <div class="p-5 border-t border-surface-container-high/60 bg-surface-container-lowest space-y-4">
          <!-- Coupon Input -->
          <div class="flex items-center gap-2">
            <div class="relative flex-1">
              <span class="material-symbols-outlined absolute left-3 top-2.5 text-on-surface-variant text-[18px]">confirmation_number</span>
              <input type="text" id="coupon-code-input" placeholder="Cupom de desconto" class="w-full pl-9 pr-3 py-2 text-xs uppercase font-mono font-bold bg-surface-container-low rounded-lg focus:outline-none focus:ring-1 focus:ring-primary border border-surface-container-high/50" />
            </div>
            <button onclick="applyCoupon()" class="px-3 py-2 bg-surface-container text-primary hover:bg-primary hover:text-on-primary transition-all rounded-lg text-xs font-bold">
              Aplicar
            </button>
          </div>
          <div id="coupon-applied-tag" class="hidden text-xs font-semibold text-emerald-600 flex items-center justify-between bg-emerald-50 p-2 rounded-lg border border-emerald-200">
            <span id="coupon-applied-text">Cupom ativado</span>
            <button onclick="removeCoupon()" class="text-error font-bold text-[10px] hover:underline">Remover</button>
          </div>

          <!-- Price Summary -->
          <div class="space-y-1.5 text-sm pt-2">
            <div class="flex justify-between text-on-surface-variant">
              <span>Subtotal:</span>
              <span id="cart-subtotal" class="font-semibold">R$ 0,00</span>
            </div>
            <div id="cart-discount-row" class="flex justify-between text-emerald-600 hidden">
              <span>Desconto:</span>
              <span id="cart-discount" class="font-bold">- R$ 0,00</span>
            </div>
            <div class="flex justify-between text-base font-extrabold text-on-surface pt-2 border-t border-surface-container-high">
              <span>Total:</span>
              <span id="cart-total" class="text-primary font-black">R$ 0,00</span>
            </div>
          </div>

          <button onclick="openCheckoutModal()" id="btn-checkout" class="w-full py-3 bg-primary text-on-primary font-bold rounded-xl shadow-md hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-sm">
            <span>Finalizar Compra</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          </button>
        </div>

      </div>
    </div>

    <!-- CHECKOUT MODAL -->
    <div id="checkout-modal-backdrop" onclick="if(event.target.id==='checkout-modal-backdrop') closeCheckoutModal()" class="fixed inset-0 bg-on-surface/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200 hidden">
      <div class="bg-surface-container-lowest rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        <div class="p-5 bg-surface-container-low border-b border-surface-container-high flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">local_mall</span>
            <h3 class="font-bold text-lg">Concluir Pedido</h3>
          </div>
          <button onclick="closeCheckoutModal()" class="text-on-surface-variant hover:text-on-surface">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <form id="checkout-form" onsubmit="submitCheckout(event)" class="p-6 overflow-y-auto space-y-4">
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase text-on-surface-variant">Nome Completo *</label>
            <input type="text" id="cust-name" required placeholder="Ex: Ana Maria" class="w-full px-3 py-2 text-sm bg-surface-container-low rounded-lg focus:outline-none focus:ring-1 focus:ring-primary" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1">
              <label class="text-xs font-bold uppercase text-on-surface-variant">E-mail *</label>
              <input type="email" id="cust-email" required placeholder="ana@email.com" class="w-full px-3 py-2 text-sm bg-surface-container-low rounded-lg focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
            <div class="space-y-1">
              <label class="text-xs font-bold uppercase text-on-surface-variant">Telefone / WhatsApp *</label>
              <input type="tel" id="cust-phone" required placeholder="(11) 99999-8888" class="w-full px-3 py-2 text-sm bg-surface-container-low rounded-lg focus:outline-none focus:ring-1 focus:ring-primary" />
            </div>
          </div>
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase text-on-surface-variant">Endereço de Entrega *</label>
            <textarea id="cust-address" required rows="2" placeholder="Rua, número, bairro, cidade - UF" class="w-full p-3 text-sm bg-surface-container-low rounded-lg focus:outline-none focus:ring-1 focus:ring-primary resize-none"></textarea>
          </div>

          <!-- Checkout Summary -->
          <div class="p-4 bg-surface-container-low rounded-xl space-y-2 text-xs">
            <div class="flex justify-between font-bold text-on-surface">
              <span>Resumo do Pedido:</span>
              <span id="modal-checkout-total" class="text-primary text-sm font-black">R$ 0,00</span>
            </div>
            <p class="text-on-surface-variant text-[11px]">Pagamento simulado via Pix / Cartão Transparente.</p>
          </div>

          <button type="submit" id="btn-submit-order" class="w-full py-3.5 bg-primary text-on-primary font-bold text-sm rounded-xl shadow-md hover:bg-primary-container transition-all flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
            <span>Confirmar e Finalizar Pedido</span>
          </button>
        </form>
      </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
